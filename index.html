    <script>
        const $ = id => document.getElementById(id);
        const L = window.AVATAR_LIBRARY;
        const SAVE = 'liveMe';

        let outfit = L.defaultOutfit(), cat = 'body';
        let PIN = '', NAME = '', MYID = null, poller = null, stage = null, joined = false;

        /* nhớ lại lần trước */
        try {
            const s = JSON.parse(localStorage.getItem(SAVE) || '{}');
            if (s.name) $('nameIn').value = s.name;
            if (s.outfit) outfit = L.fixSet(Object.assign(L.defaultOutfit(), L.unpack(s.outfit)));
        } catch (e) { }
        const qp = new URLSearchParams(location.search);
        if (qp.get('pin')) $('pinIn').value = qp.get('pin').replace(/\D/g, '').slice(0, 6);

        function show(n) { ['s1', 's2', 's3', 's4', 's5'].forEach(id => $(id).classList.toggle('on', id === n)); }

        /* ---------- 1. nhập mã ---------- */
        $('pinIn').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
        $('goPick').onclick = function () {
            PIN = $('pinIn').value.trim();
            NAME = $('nameIn').value.trim().replace(/\s+/g, ' ');
            if (PIN.length !== 6) return $('e1').textContent = 'Mã phòng gồm 6 chữ số.';
            if (NAME.length < 2) return $('e1').textContent = 'Em nhập tên đầy đủ giúp thầy cô nhé.';
            $('e1').textContent = '';
            buildPicker(); show('s2');
        };

        /* ---------- 2. chọn trang phục ---------- */
        function drawPreview() { $('prev').innerHTML = L.renderSVG(outfit, { size: 512 }); }

        function buildTabs() {
            $('tabs').innerHTML = L.CATEGORIES.map(c =>
                '<div class="tab' + (c.key === cat ? ' on' : '') + '" data-c="' + c.key + '">' + c.icon + ' ' + c.label + '</div>').join('');
            $('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => { cat = t.dataset.c; buildTabs(); buildItems(); });
        }

        function buildItems() {
            const c = L.CATEGORIES.find(x => x.key === cat);
            const mySet = L.setOf(outfit);
            // Hiện HẾT mọi món. Món khác bộ thì làm mờ + ghi rõ, bấm vào sẽ tự
            // đổi bộ giúp — chứ ẩn đi thì thêm đồ mới vào mà không ai thấy.
            const list = L.byCat(cat);
            let html = '';
            if (!c.required) {
                html += '<div class="it' + (!outfit[cat] ? ' on' : '') + '" data-id=""><div style="height:56px;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.5">🚫</div><div class="n">Không dùng</div></div>';
            }
            html += list.map(function (i) {
                const alt = i.set !== mySet;
                // xem thử trên đúng thân cùng bộ với món đó, cho khỏi lệch
                const o = { body: alt ? L.firstBodyOf(i.set) : (outfit.body || 'body_light') };
                o[i.cat] = i.id;
                const r = L.RARITY[i.rarity] || L.RARITY.common;
                return '<div class="it' + (outfit[cat] === i.id ? ' on' : '') + (alt ? ' alt' : '') +
                    '" data-id="' + i.id + '" data-set="' + i.set + '">' +
                    '<span class="r" style="background:' + r.color + '"></span>' +
                    L.renderSVG(o, { size: 76 }) +
                    '<div class="n">' + i.name + (alt ? '<br><span class="sw">' + L.setName(i.set) + '</span>' : '') +
                    '</div></div>';
            }).join('');
            $('items').innerHTML = html;
            $('items').querySelectorAll('.it').forEach(function (el) {
                el.onclick = function () {
                    const id = el.dataset.id || null;
                    const s = el.dataset.set;
                    if (id && s && s !== L.setOf(outfit)) {
                        // Món thuộc bộ khác: đổi cả thân người cho khớp tỉ lệ
                        outfit = L.switchSet(outfit, s, cat, id);
                        toast('Đã đổi sang ' + L.setName(s) + ' — đồ cũ khác bộ nên phải chọn lại');
                    } else {
                        outfit[cat] = id;
                        if (cat === 'body') outfit = L.fixSet(outfit);
                    }
                    buildItems(); drawPreview(); pushOutfit();
                };
            });
        }

        let toastTimer = null;
        function toast(msg) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.add('on');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
        }

        function buildPicker() { buildTabs(); buildItems(); drawPreview(); }

        $('rndBtn').onclick = function () { outfit = L.randomOutfit(); buildItems(); drawPreview(); pushOutfit(); };

        let pushTimer = null;
        function pushOutfit() {
            if (!joined) return;
            clearTimeout(pushTimer);
            pushTimer = setTimeout(function () {
                LiveNet.update(PIN, MYID, L.pack(outfit)).catch(function () { });
            }, 400);
        }

        function remember() {
            try { localStorage.setItem(SAVE, JSON.stringify({ name: NAME, outfit: L.pack(outfit) })); } catch (e) { }
        }

        /* ---------- vào phòng ---------- */
        $('joinBtn').onclick = function () {
            const b = this; b.disabled = true; b.textContent = 'Đang vào…'; $('e2').textContent = '';
            if (joined) {                       // quay lại từ nút "Đổi đồ"
                LiveNet.update(PIN, MYID, L.pack(outfit), NAME).catch(function () { });
                remember(); b.disabled = false; b.textContent = 'Lên sân khấu 🎬'; show('s3');
                if (poller) poller.refreshNow();
                return;
            }
            LiveNet.join(PIN, NAME, L.pack(outfit))
                .then(function (d) {
                    MYID = d.playerId; joined = true; remember();
                    $('rTitle').textContent = d.title || 'Phòng chờ';
                    b.disabled = false; b.textContent = 'Lên sân khấu 🎬';
                    startStage();
                })
                .catch(function (e) {
                    $('e2').textContent = e.message || 'Không vào được phòng.';
                    b.disabled = false; b.textContent = 'Lên sân khấu 🎬';
                });
        };

        /* ---------- 3. sân khấu ---------- */
        function startStage() {
            show('s3');
            stage = LiveStage.mount($('stage'), {
                meId: MYID, emptyText: 'Đang lên sân khấu…',
                onPick: askInteract
            });
            $('emotes').innerHTML = ['👍', '😂', '🔥', '❤️', '😮'].map(e =>
                '<button data-e="' + e + '">' + e + '</button>').join('');
            let lastEmote = 0;
            $('emotes').querySelectorAll('button').forEach(b => b.onclick = function () {
                if (navigator.vibrate) navigator.vibrate(15);
                if (Date.now() - lastEmote < 1500) return;   // chặn spam, đỡ tốn hạn mức
                lastEmote = Date.now();
                LiveNet.emote(PIN, MYID, b.dataset.e).catch(function () { });
            });

            poller = LiveNet.Poller(PIN, function (d) {
                const players = d.players || [];
                stage.sync(players);
                CLASS_N = Math.max(1, players.length);
                $('rCount').textContent = players.length + ' người';
                if (d.title) $('rTitle').textContent = d.title;
                if (typeof d.fx === 'boolean') {
                    ixOn = d.fx;
                    $('ixHint').style.display = d.fx && players.length > 1 ? '' : 'none';
                }
                if (!players.some(p => p.id === MYID)) {
                    $('waitMsg').className = ''; $('waitMsg').textContent = '⚠️ Em đã bị mời ra khỏi phòng.';
                } else if (d.status === 'playing') {
                    $('waitMsg').className = ''; $('waitMsg').textContent = '🎬 Bài làm sắp bắt đầu!';
                    enterQuiz();
                }
            }, {
                // Màn hình lớp mới là cái cả lớp nhìn, nên để nó hỏi dày.
                // Điện thoại từng em hỏi thưa hơn, và giãn tới 20s khi phòng
                // đứng yên — đo thật cho thấy đây là chỗ ngốn quota nhiều nhất.
                interval: LiveNet.isGAS ? 4000 : 900,
                maxInterval: LiveNet.isGAS ? 20000 : 3000,
                playerId: MYID,
                onError: function (e, n) { if (n > 2) { $('waitMsg').className = ''; $('waitMsg').textContent = '📶 Mạng chập chờn, đang thử lại…'; } }
            }).start();
        }

        $('editBtn').onclick = function () { buildPicker(); show('s2'); };

        /* ---------- rủ bạn tương tác ----------
           Bấm vào nhân vật của bạn trên sân khấu -> chọn 💖 hoặc 💥.
           Không hỏi ý bạn kia: hỏi thì tốn gấp đôi lượt gọi mà lại hết vui vì
           phải chờ. Bù lại thầy cô có công tắc tắt hẳn phần này. */
        let ixTarget = null, ixLast = 0, ixOn = true;

        function askInteract(p) {
            if (!p || p.id === MYID || !joined) return;
            if (!ixOn) return toast('Thầy cô đang tắt phần tương tác.');
            if (Date.now() - ixLast < 4000) return toast('Em chờ một chút rồi rủ tiếp nhé.');
            ixTarget = p;
            $('ixName').textContent = p.name;
            $('ixSheet').classList.add('on');
        }

        $('ixSheet').querySelectorAll('.acts button').forEach(function (b) {
            b.onclick = function () {
                const kind = b.dataset.k;
                $('ixSheet').classList.remove('on');
                if (!kind || !ixTarget) return;
                if (navigator.vibrate) navigator.vibrate(20);
                ixLast = Date.now();
                const name = ixTarget.name, id = ixTarget.id;
                // Vẽ ngay tại máy. Chờ Apps Script trả lời rồi mới vẽ là mất
                // khoảng 3 giây — lâu tới mức em nào cũng tưởng bấm hụt.
                if (stage) stage.playLocal(MYID, id, kind);
                LiveNet.interact(PIN, MYID, id, kind)
                    .then(function () {
                        toast((kind === 'love' ? '💖 Đã ôm ' : '💥 Đang tỉ thí với ') + name);
                        if (poller) poller.refreshNow();
                    })
                    .catch(function (e) {
                        if (stage) stage.cancelLocal(MYID);      // máy chủ không nhận thì rút lại
                        toast(e.message || 'Không rủ được, thử lại nhé.');
                    });
                ixTarget = null;
            };
        });
        $('ixSheet').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };

        window.addEventListener('beforeunload', function () {
            if (poller) poller.stop();
            // Đang làm bài mà báo rời phòng là XOÁ luôn em khỏi bảng xếp hạng —
            // điện thoại tắt màn hình hay lỡ tay F5 cũng đủ mất trắng điểm.
            if (joined && !playing && navigator.sendBeacon) {
                try { navigator.sendBeacon(LiveNet.endpoint, new Blob([JSON.stringify({ action: 'liveLeave', pin: PIN, playerId: MYID })], { type: 'text/plain' })); } catch (e) { }
            }
        });

        /* =====================================================================
         *  LÀM BÀI — mỗi em tự làm theo nhịp riêng
         *  -------------------------------------------------------------------
         *  Toàn bộ đề nằm sẵn trong máy, chấm cũng ngay trong máy. Trong suốt
         *  lúc làm bài trang này KHÔNG hỏi trạng thái phòng nữa, chỉ báo điểm
         *  về theo nhịp thưa — nếu vẫn giữ vòng hỏi 4 giây như ở sảnh chờ thì
         *  một buổi 35 em đã ngốn hết hạn mức Apps Script của cả ngày.
         * ===================================================================== */

        let QUIZ = null, QI = 0, SCORE = 0, OKN = 0, STREAK = 0;
        let ANS = [], playing = false, reporter = null, qTimer = null, qStart = 0, playT0 = 0;
        let CLASS_N = 1;

        /** Bao lâu báo điểm một lần. Lớp càng đông càng phải giãn ra, vì chi phí
         *  hạn mức tỉ lệ với (số em ÷ nhịp báo), không phải với payload. */
        function reportEvery() {
            if (!LiveNet.isGAS) return 4;
            return Math.min(90, Math.max(25, Math.round(CLASS_N * 2.6)));
        }

        function enterQuiz() {
            if (playing) return;
            playing = true;
            if (poller) poller.stop();
            show('s4');
            $('qText').textContent = 'Đang tải đề…';
            $('qOpts').innerHTML = '';
            fetchQuiz(0);
        }

        function fetchQuiz(tries) {
            LiveNet.getQuiz(PIN).then(function (d) {
                QUIZ = d.quiz;
                if (!QUIZ || !QUIZ.qs || !QUIZ.qs.length) throw new Error('Bộ đề trống.');
                prepMath(QUIZ.qs);
                startQuiz();
            }).catch(function (e) {
                if (tries < 6) {
                    $('qText').innerHTML = 'Đang tải đề… <span style="font-size:14px;opacity:.7">(thử lại lần ' + (tries + 1) + ')</span>';
                    setTimeout(function () { fetchQuiz(tries + 1); }, 2500);
                } else {
                    $('qText').innerHTML = '😔 Không tải được đề.<br><span style="font-size:14px;font-weight:400">' +
                        (e.message || '') + '</span>';
                    $('qOpts').innerHTML = '<button class="btn" onclick="location.reload()">Thử lại</button>';
                }
            });
        }

        function startQuiz() {
            QI = 0; SCORE = 0; OKN = 0; STREAK = 0; ANS = []; playT0 = Date.now();
            $('qTot').textContent = QUIZ.qs.length;
            reporter = LiveNet.Reporter(PIN, MYID, onRank, { every: reportEvery() });
            renderQ();
        }

        function renderQ() {
            if (QI >= QUIZ.qs.length) return finishQuiz();
            const it = QUIZ.qs[QI];
            $('qNo').textContent = QI + 1;
            $('qScore').textContent = SCORE;
            $('qStreak').textContent = STREAK >= 3 ? '🔥 ' + STREAK : '';
            $('qCtx').style.display = it.c ? 'block' : 'none';
            if (it.c) $('qCtx').innerHTML = it.c;
            $('qText').innerHTML = it.q + (it.m ? '<br><img src="' + it.m + '" alt="">' : '');

            const box = $('qOpts');
            box.innerHTML = '';
            if (it.t === 'mc') {
                it.o.forEach(function (o, i) {
                    const b = document.createElement('button');
                    b.className = 'opt';
                    b.innerHTML = '<span class="k">' + 'ABCDEFGH'[i] + '</span><span>' + o + '</span>';
                    b.onclick = function () { pick(b, i); };
                    box.appendChild(b);
                });
            } else if (it.t === 'tf') {
                [['Đúng', true], ['Sai', false]].forEach(function (p) {
                    const b = document.createElement('button');
                    b.className = 'opt tf';
                    b.textContent = p[0];
                    b.onclick = function () { pick(b, p[1]); };
                    box.appendChild(b);
                });
            } else {
                const inp = document.createElement('input');
                inp.placeholder = 'Điền câu trả lời…';
                inp.autocomplete = 'off';
                const b = document.createElement('button');
                b.className = 'btn'; b.textContent = 'Trả lời →';
                b.onclick = function () { if (inp.value.trim()) pick(b, inp.value.trim()); };
                inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') b.onclick(); });
                box.appendChild(inp); box.appendChild(b);
                setTimeout(function () { inp.focus(); }, 120);
            }
            typeset(box); typeset($('qText'));

            locked = false;
            qStart = Date.now();
            startTimer();
        }

        function startTimer() {
            const bar = $('qTimer'), fill = bar.querySelector('i');
            clearTimeout(qTimer);
            bar.classList.remove('low');
            fill.style.transition = 'none';
            fill.style.transform = 'scaleX(1)';
            if (!QUIZ.lim) { bar.style.visibility = 'hidden'; return; }   // không giới hạn giờ
            bar.style.visibility = 'visible';
            // ép trình duyệt vẽ lại trước khi chạy hiệu ứng, nếu không thanh đứng im
            void fill.offsetWidth;
            fill.style.transition = 'transform ' + QUIZ.lim + 's linear';
            fill.style.transform = 'scaleX(0)';
            setTimeout(function () { bar.classList.add('low'); }, Math.max(0, (QUIZ.lim - 5) * 1000));
            qTimer = setTimeout(function () { answer(null); }, QUIZ.lim * 1000);
        }

        function pick(btn, val) {
            if (btn.classList.contains('opt')) {
                Array.prototype.forEach.call(btn.parentNode.children, c => c.classList && c.classList.remove('pick'));
                btn.classList.add('pick');
            }
            answer(val);
        }

        let locked = false;   // chống trả lời hai lần khi bấm đúng lúc hết giờ
        function answer(val) {
            if (locked) return;
            locked = true;
            clearTimeout(qTimer);
            $('qOpts').querySelectorAll('button,input').forEach(function (b) { b.disabled = true; });
            const it = QUIZ.qs[QI];
            const ms = Date.now() - qStart;
            const ok = val !== null && LiveQuiz.isCorrect(it, val);
            STREAK = ok ? STREAK + 1 : 0;
            SCORE += LiveQuiz.points(ok, ms, QUIZ.lim, STREAK);
            if (ok) OKN++;
            ANS.push({ i: it.i, v: val, ok: ok, ms: ms });

            if (navigator.vibrate) navigator.vibrate(12);
            if (STREAK >= 3) pop('🔥 ' + STREAK + ' câu liền!');
            else if (val === null) pop('⏰ Hết giờ');

            reporter.push({ sc: SCORE, an: ANS.length, ok: OKN, ms: Date.now() - playT0 });
            QI++;
            setTimeout(renderQ, val === null ? 900 : 330);
        }

        function pop(txt) {
            const e = $('qPop');
            e.textContent = txt;
            e.classList.remove('go'); void e.offsetWidth; e.classList.add('go');
        }

        let FINAL_MS = 0;
        function finishQuiz() {
            clearTimeout(qTimer);
            // Chốt thời gian làm bài tại đây. Cùng điểm thì ai xong sớm hơn xếp
            // trên, nên nếu để đồng hồ chạy tiếp sau khi nộp thì em nào ngồi
            // xem lại bài lâu sẽ tự tụt hạng một cách vô lý.
            const ms = FINAL_MS = Date.now() - playT0;
            reporter.finish({
                sc: SCORE, an: ANS.length, ok: OKN, ms: ms,
                // Một KÝ TỰ cho mỗi câu, đúng thứ tự đề: 1 đúng, 0 sai, - bỏ trống.
                // Cả lớp dùng chung một bộ đề nên không cần gửi kèm mã câu hỏi —
                // 120 em × mã câu hỏi là đủ làm vỡ ô nhớ 100KB của cả phòng.
                det: ANS.map(a => a.v === null ? '-' : (a.ok ? '1' : '0')).join('')
            });
            show('s5');
            $('rScore').textContent = SCORE;
            $('rRank').textContent = 'Đúng ' + OKN + '/' + QUIZ.qs.length + ' câu · đang gửi kết quả…';
            paintReview();
        }

        function onRank(d) {
            if (!d || !d.rank) return;
            $('rRank').innerHTML = 'Đúng <b>' + OKN + '/' + QUIZ.qs.length + '</b> câu · Hạng <b>' + d.rank + '</b>/' + d.total +
                (d.status === 'done' ? '<br><span style="color:#8dffc0">🏁 Thầy cô đã chốt kết quả buổi chơi.</span>' : '');
            $('rTop').innerHTML = (d.top || []).map(function (t, i) {
                return '<div' + (t.name === NAME ? ' class="me"' : '') + '><span>' +
                    ['🥇', '🥈', '🥉', '4.', '5.'][i] + ' ' + esc(t.name) + '</span><b>' + t.sc + '</b></div>';
            }).join('');
        }

        $('rAgain').onclick = function () {
            const b = this; b.disabled = true; b.textContent = 'Đang xem…';
            LiveNet.progress(PIN, MYID, { sc: SCORE, an: ANS.length, ok: OKN, ms: FINAL_MS, done: true })
                .then(onRank).catch(function () { })
                .then(function () { b.disabled = false; b.textContent = '🔄 Xem lại thứ hạng'; });
        };

        function paintReview() {
            $('rRev').innerHTML = ANS.map(function (a, i) {
                const it = QUIZ.qs[i];
                let right;
                if (it.t === 'mc') right = it.o[it.a];
                else if (it.t === 'tf') right = it.a ? 'Đúng' : 'Sai';
                else right = it.a;
                let mine = a.v === null ? '(không kịp trả lời)'
                    : it.t === 'mc' ? it.o[a.v] : it.t === 'tf' ? (a.v ? 'Đúng' : 'Sai') : a.v;
                return '<div class="c' + (a.ok ? '' : ' bad') + '">' +
                    '<div class="h">' + (a.ok ? '✅' : '❌') + ' Câu ' + (i + 1) + '. ' + it.q + '</div>' +
                    (a.ok ? '' : '<div class="a">Em chọn: ' + mine + '</div>') +
                    '<div class="a">Đáp án đúng: <b>' + right + '</b></div>' +
                    (it.x ? '<div class="x">💡 ' + it.x + '</div>' : '') +
                    '</div>';
            }).join('');
            typeset($('rRev'));
        }

        function esc(s) { return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }

        /* ---------- công thức toán: chỉ nạp KaTeX khi đề thật sự có ---------- */
        let mathOn = false;
        function prepMath(qs) {
            const need = qs.some(q => /[$\\]/.test(JSON.stringify(q)));
            if (!need || mathOn) return;
            mathOn = true;
            const css = document.createElement('link');
            css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
            js.onload = function () {
                const auto = document.createElement('script');
                auto.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js';
                auto.onload = function () { typeset($('qText')); typeset($('qOpts')); };
                document.head.appendChild(auto);
            };
            document.head.appendChild(js);
        }

        function typeset(el) {
            if (!mathOn || !window.renderMathInElement) return;
            try {
                window.renderMathInElement(el, {
                    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
                    throwOnError: false
                });
            } catch (e) { }
        }
    </script>
</body>

</html>
