<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vào phòng chơi</title>
    <style>
        :root {
            --bg: #0b0a1f;
            --card: rgba(255, 255, 255, .07);
            --line: rgba(255, 255, 255, .15);
            --tx: #f4f2ff;
            --dim: #a9a3d6;
            --acc: #7c5cff;
            --acc2: #ff5d9e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: radial-gradient(90% 55% at 50% 0%, #241c56, var(--bg));
            color: var(--tx);
            font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            overscroll-behavior: none
        }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom))
        }

        .screen.on {
            display: flex
        }

        .btn {
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            border: 0;
            color: #fff;
            font-weight: 800;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 17px;
            width: 100%;
            min-height: 54px;
            box-shadow: 0 8px 22px rgba(124, 92, 255, .35)
        }

        .btn:disabled {
            opacity: .45;
            box-shadow: none
        }

        .btn.ghost {
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--line);
            box-shadow: none;
            font-weight: 600
        }

        input {
            background: rgba(0, 0, 0, .35);
            border: 1px solid var(--line);
            color: var(--tx);
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 17px;
            width: 100%
        }

        input::placeholder {
            color: #7d76ab
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--dim);
            margin: 16px 0 7px
        }

        h1 {
            margin: 0 0 4px;
            font-size: 25px
        }

        .sub {
            color: var(--dim);
            font-size: 14px;
            margin: 0
        }

        .err {
            color: #ff9aa6;
            font-size: 14px;
            min-height: 20px;
            margin: 10px 0 0
        }

        /* --- màn nhập mã --- */
        #s1 {
            justify-content: center;
            text-align: center
        }

        #pinIn {
            text-align: center;
            font-size: 30px;
            letter-spacing: .3em;
            font-weight: 800;
            padding: 18px 10px
        }

        /* --- màn chọn trang phục --- */
        #s2 .stagepreview {
            flex: 0 0 auto;
            height: 34vh;
            min-height: 190px;
            border-radius: 20px;
            background: radial-gradient(90% 70% at 50% 10%, #3a2f7a, #17123a);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            overflow: hidden
        }

        #s2 .stagepreview::after {
            content: '';
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -14%;
            height: 46%;
            background: linear-gradient(#5a49c9, #241d5c);
            transform: perspective(400px) rotateX(52deg)
        }

        #s2 .stagepreview svg {
            position: relative;
            z-index: 2;
            height: 92%;
            width: auto;
            margin-bottom: 4%;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5))
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 14px 0 10px;
            scrollbar-width: none
        }

        .tabs::-webkit-scrollbar {
            display: none
        }

        .tab {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, .07);
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .tab.on {
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            color: #fff;
            border-color: transparent
        }

        .items {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 10px;
            padding-bottom: 12px;
            align-content: start
        }

        .it {
            background: rgba(0, 0, 0, .3);
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 6px 4px 7px;
            text-align: center;
            cursor: pointer;
            position: relative
        }

        .it svg {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto
        }

        .it .n {
            font-size: 10.5px;
            color: var(--dim);
            line-height: 1.25;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .it.on {
            border-color: #fff;
            background: rgba(124, 92, 255, .28)
        }

        .it .r {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%
        }

        /* Món thuộc bộ khác: vẫn thấy được, bấm vào thì tự đổi bộ */
        .it.alt {
            opacity: .58;
            border-style: dashed;
            border-color: rgba(255, 255, 255, .22)
        }

        .it.alt .sw {
            color: #ffc27a;
            font-size: 9.5px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 96px;
            transform: translate(-50%, 14px);
            background: rgba(12, 10, 32, .95);
            border: 1px solid var(--line);
            color: #fff;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 88vw;
            text-align: center;
            line-height: 1.45;
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s, transform .22s;
            z-index: 99
        }

        #toast.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        .bar {
            display: flex;
            gap: 10px;
            padding-top: 10px
        }

        /* --- màn sân khấu --- */
        #s3 {
            padding: 0
        }

        #s3 .hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: max(12px, env(safe-area-inset-top)) 14px 10px
        }

        #s3 .hdr .t {
            font-size: 15px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        #s3 .hdr .c {
            font-size: 13px;
            color: var(--dim);
            flex: 0 0 auto
        }

        #stage {
            flex: 1;
            margin: 0 10px;
            min-height: 0
        }

        .emotes {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 12px 10px max(12px, env(safe-area-inset-bottom))
        }

        .emotes button {
            flex: 1;
            max-width: 74px;
            font-size: 26px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 9px 0;
            cursor: pointer;
            min-height: 52px
        }

        .emotes button:active {
            transform: scale(.9)
        }

        .waiting {
            text-align: center;
            color: var(--dim);
            font-size: 13.5px;
            padding: 0 14px 6px
        }

        .dots::after {
            content: '';
            animation: d 1.4s steps(4, end) infinite
        }

        /* ===== rủ bạn tương tác ===== */
        .sheet {
            position: fixed;
            inset: 0;
            background: rgba(6, 4, 20, .72);
            backdrop-filter: blur(5px);
            display: none;
            align-items: flex-end;
            z-index: 900
        }

        .sheet.on {
            display: flex
        }

        .sheet .box {
            background: #171243;
            border-top: 1px solid var(--line);
            border-radius: 22px 22px 0 0;
            padding: 22px 18px max(22px, env(safe-area-inset-bottom));
            width: 100%
        }

        .sheet h3 {
            margin: 0 0 4px;
            font-size: 19px
        }

        .sheet p {
            margin: 0 0 18px;
            color: var(--dim);
            font-size: 13.5px
        }

        .sheet .acts {
            display: flex;
            gap: 12px
        }

        .sheet .acts button {
            flex: 1;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .07);
            color: var(--tx);
            border-radius: 18px;
            padding: 16px 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer
        }

        .sheet .acts button span {
            display: block;
            font-size: 30px;
            margin-bottom: 6px
        }

        .sheet .acts button:active {
            transform: scale(.96)
        }

        /* ===== màn làm bài ===== */
        #s4 {
            padding-top: max(10px, env(safe-area-inset-top))
        }

        .qtop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13.5px;
            color: var(--dim)
        }

        .qtop b {
            color: var(--tx);
            font-size: 17px
        }

        .timer {
            height: 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .12);
            overflow: hidden;
            margin: 9px 0 4px
        }

        .timer i {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #6ee7a8, #ffd76a);
            transform-origin: left
        }

        .timer.low i {
            background: linear-gradient(90deg, #ff8a5c, #ff5d7e)
        }

        .qbody {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 2px
        }

        .qctx {
            background: rgba(255, 255, 255, .06);
            border-left: 3px solid var(--acc);
            border-radius: 0 12px 12px 0;
            padding: 10px 13px;
            font-size: 14px;
            color: #d9d4ff
        }

        .qtext {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.45
        }

        .qtext img,
        .qrev img {
            max-width: 100%;
            border-radius: 12px
        }

        .opts {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, .07);
            border: 1px solid var(--line);
            color: var(--tx);
            border-radius: 16px;
            padding: 14px;
            font-size: 16.5px;
            min-height: 58px;
            cursor: pointer;
            transition: transform .12s, background .18s
        }

        .opt:active {
            transform: scale(.98)
        }

        .opt.pick {
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            border-color: transparent;
            font-weight: 700
        }

        .opt .k {
            flex: 0 0 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900
        }

        .opt.tf {
            justify-content: center;
            font-size: 19px;
            font-weight: 800
        }

        .streak {
            position: absolute;
            left: 50%;
            top: 38%;
            transform: translate(-50%, -50%) scale(.4);
            font-size: 34px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 6px 22px rgba(0, 0, 0, .6)
        }

        .streak.go {
            animation: pop 1s ease-out
        }

        @keyframes pop {
            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15)
            }

            70% {
                opacity: 1;
                transform: translate(-50%, -60%) scale(1)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -110%) scale(.9)
            }
        }

        /* ===== màn kết quả ===== */
        #s5 .big {
            text-align: center;
            padding: 8px 0 4px
        }

        #s5 .big .sc {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(120deg, #fff, #b9a6ff, #ff9ecb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        #s5 .big .rk {
            font-size: 15px;
            color: var(--dim)
        }

        .top5 {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 12px 0
        }

        .top5 div {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, .06);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 14px
        }

        .top5 div.me {
            background: linear-gradient(90deg, rgba(124, 92, 255, .5), rgba(255, 93, 158, .28));
            font-weight: 700
        }

        .qrev {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 8px
        }

        .qrev .c {
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-left: 4px solid #6ee7a8;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14.5px
        }

        .qrev .c.bad {
            border-left-color: #ff5d7e
        }

        .qrev .c .h {
            font-weight: 700;
            margin-bottom: 6px
        }

        .qrev .c .a {
            color: var(--dim);
            font-size: 13.5px;
            margin-top: 5px
        }

        .qrev .c .x {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--line);
            font-size: 13.5px;
            color: #d9d4ff
        }

        @keyframes d {
            0% {
                content: ''
            }

            25% {
                content: '.'
            }

            50% {
                content: '..'
            }

            75% {
                content: '...'
            }
        }
    </style>
</head>

<body>

    <!-- ===== 1. NHẬP MÃ ===== -->
    <div class="screen on" id="s1">
        <h1>🎪 Vào phòng</h1>
        <p class="sub">Nhập mã phòng thầy cô đang chiếu trên màn hình</p>
        <label for="pinIn">Mã phòng</label>
        <input id="pinIn" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
        <label for="nameIn">Tên của em</label>
        <input id="nameIn" maxlength="24" placeholder="VD: Nguyễn Văn An" autocomplete="name">
        <p class="err" id="e1"></p>
        <div style="margin-top:6px"><button class="btn" id="goPick">Tiếp tục →</button></div>
    </div>

    <!-- ===== 2. CHỌN TRANG PHỤC ===== -->
    <div class="screen" id="s2">
        <div class="stagepreview" id="prev"></div>
        <div class="tabs" id="tabs"></div>
        <div class="items" id="items"></div>
        <p class="err" id="e2"></p>
        <div class="bar">
            <button class="btn ghost" id="rndBtn" style="flex:0 0 58px">🎲</button>
            <button class="btn" id="joinBtn">Lên sân khấu 🎬</button>
        </div>
    </div>

    <!-- ===== 3. SÂN KHẤU ===== -->
    <div class="screen" id="s3">
        <div class="hdr">
            <span class="t" id="rTitle">Phòng chờ</span>
            <span class="c" id="rCount">0 người</span>
            <button class="btn ghost" id="editBtn" style="width:auto;min-height:38px;padding:8px 14px;font-size:13px">👕
                Đổi đồ</button>
        </div>
        <div id="stage"></div>
        <p class="waiting"><span id="waitMsg" class="dots">Chờ thầy cô bắt đầu</span></p>
        <p class="waiting" id="ixHint" style="opacity:.72;margin-top:-4px">👆 Bấm vào nhân vật của bạn để 💖 ôm hoặc
            💥 tỉ thí</p>
        <div class="emotes" id="emotes"></div>
    </div>

    <!-- ===== RỦ BẠN TƯƠNG TÁC ===== -->
    <div class="sheet" id="ixSheet">
        <div class="box">
            <h3 id="ixName">Bạn</h3>
            <p>Chọn kiểu tương tác — cả lớp sẽ thấy trên màn hình lớn</p>
            <div class="acts">
                <button data-k="love"><span>💖</span>Ôm hôn</button>
                <button data-k="fight"><span>💥</span>Tỉ thí</button>
                <button data-k=""><span>✖️</span>Thôi</button>
            </div>
        </div>
    </div>

    <!-- ===== 4. LÀM BÀI ===== -->
    <div class="screen" id="s4">
        <div class="qtop">
            <span>Câu <b id="qNo">1</b> / <span id="qTot">10</span></span>
            <span id="qStreak"></span>
            <span>Điểm <b id="qScore">0</b></span>
        </div>
        <div class="timer" id="qTimer"><i></i></div>
        <div class="qbody">
            <div class="qctx" id="qCtx" style="display:none"></div>
            <div class="qtext" id="qText">…</div>
            <div class="opts" id="qOpts"></div>
        </div>
        <div class="streak" id="qPop"></div>
    </div>

    <!-- ===== 5. KẾT QUẢ ===== -->
    <div class="screen" id="s5">
        <div class="big">
            <div class="sc" id="rScore">0</div>
            <div class="rk" id="rRank">Đang gửi kết quả…</div>
        </div>
        <div class="top5" id="rTop"></div>
        <div class="qrev" id="rRev"></div>
        <button class="btn ghost" id="rAgain">🔄 Xem lại thứ hạng</button>
    </div>

    <script>window.LIVE_ENDPOINT = "https://script.google.com/macros/s/AKfycbxn39tDwvyGq6rn4AXWv_1YicZYREIwNuaMD95dnZz3DkMlcr1t2CMnw_7Nl7HhaH0Raw/exec";</script>
    <script>
/* === avatar_library.js === */
/* =====================================================================
 *  KHO TRANG PHỤC NHÂN VẬT CHIBI  —  avatar_library.js
 *  ---------------------------------------------------------------
 *  ĐÂY LÀ FILE DUY NHẤT CẦN SỬA khi muốn thêm quần / áo / tóc / vật cầm tay.
 *
 *  CÁCH NHANH NHẤT — dùng trang nhập ảnh, khỏi tính toán gì:
 *    http://localhost:3000/avatar_import.html
 *    Thả ảnh AI vẽ vào → nó bóc nền, cắt viền, cho kéo đặt lên người,
 *    rồi in ra sẵn dòng code để dán xuống mục ITEMS bên dưới.
 *
 *  THÊM TAY (nếu ảnh đã cắt sẵn nền trong suốt):
 *    1. Bỏ file PNG vào  public/avatars/<loại>/
 *    2. Thêm ĐÚNG MỘT DÒNG vào mảng ITEMS, ví dụ:
 *         I('hair_09', 'Tóc đuôi gà', 'hair', 'rare', { set:'g1', place:[134,24,244,250] }),
 *       (tên file mặc định = <id>.png  → avatars/hair/hair_09.png)
 *
 *  Prompt nhờ AI vẽ:  PROMPT_TAO_TRANG_PHUC.md
 *  Xem thử cả kho:    http://localhost:3000/avatar_rig.html
 * ===================================================================== */

(function (root) {
  'use strict';

  /* ------------------------------------------------------------------
   * 1. RIG — KHUNG XƯƠNG CHUẨN
   *    Mọi ảnh PNG đều vẽ trên đúng khung 512x512 này. Món đồ nằm sẵn
   *    đúng chỗ của nó trong ảnh, phần còn lại trong suốt. Nhờ vậy ghép
   *    ảnh chỉ là xếp chồng lên nhau -> không bao giờ lệch.
   * ------------------------------------------------------------------ */
  const RIG = {
    canvas: 512,
    baseline: 470,                       // mặt sàn (gan bàn chân)
    head: { cx: 256, cy: 170, r: 110 },  // đầu
    face: { eyeY: 188, eyeDx: 41 },      // hai mắt ở (256±41, 188)
    neck: { x: 236, y: 262, w: 40, h: 34 },
    torso: { x: 191, y: 280, w: 130, h: 118 },
    shoulder: { l: [188, 306], r: [324, 306] },
    hand: { l: [152, 388], r: [360, 388] }, // TAY PHẢI NHÂN VẬT = bên phải màn hình
    hip: { y: 398 },
    foot: { l: [226, 470], r: [286, 470] }
  };

  /* ------------------------------------------------------------------
   * 2. THỨ TỰ XẾP LỚP (số nhỏ = nằm dưới)
   * ------------------------------------------------------------------ */
  const LAYERS = [
    { key: 'hairBack', z: 10 },  // phần tóc dài xoã sau lưng (tuỳ chọn)
    { key: 'body', z: 20 },  // thân + mặt (theo tông da)
    { key: 'pants', z: 30 },
    { key: 'shirt', z: 40 },
    { key: 'hair', z: 50 },
    { key: 'hand', z: 60 }   // vật cầm tay
  ];

  /* ------------------------------------------------------------------
   * 3. CÁC LOẠI TRANG PHỤC (hiện trên thanh chọn của học sinh)
   * ------------------------------------------------------------------ */
  const CATEGORIES = [
    { key: 'body', label: 'Tông da', icon: '🧒', required: true },
    { key: 'hair', label: 'Tóc', icon: '💇', required: false },
    { key: 'shirt', label: 'Áo', icon: '👕', required: false },
    { key: 'pants', label: 'Quần', icon: '👖', required: false },
    { key: 'hand', label: 'Vật cầm tay', icon: '🗡️', required: false }
  ];

  /* Tên dễ đọc của từng bộ — hiện lên cho học sinh biết mình đang mặc bộ nào.
     Thêm bộ mới thì thêm một dòng ở đây, thiếu cũng không sao (tự lấy mã bộ). */
  const SET_NAMES = {
    v1: 'Bộ dựng sẵn',
    g1: 'Bộ vẽ tay'
  };

  const RARITY = {
    common: { label: 'Thường', color: '#94a3b8' },
    rare: { label: 'Hiếm', color: '#38bdf8' },
    epic: { label: 'Sử thi', color: '#a855f7' },
    legend: { label: 'Huyền thoại', color: '#f59e0b' }
  };

  /* ------------------------------------------------------------------
   * 4. KHO ĐỒ  ←←← CHỖ DUY NHẤT CẦN SỬA ĐỂ THÊM ĐỒ MỚI
   * ------------------------------------------------------------------
   *  I(id, tên, loại, độ_hiếm, tuỳ_chọn)
   *
   *  tuỳ_chọn (bỏ trống cũng được):
   *    { src:  'đường/dẫn/khác.png' }   ghi đè đường dẫn mặc định
   *    { back: 'avatars/hair/x_back.png' } lớp tóc xoã sau lưng
   *    { hue:  120 }                    xoay màu ảnh gốc (0-360) — cách
   *                                     rẻ nhất để có 1 món nhiều màu mà
   *                                     không phải vẽ lại
   *    { svg:  '<g>...</g>' }           hình vẽ vector sẵn có, dùng khi
   *                                     chưa có file PNG (đồ khởi động)
   * ------------------------------------------------------------------ */

  // ==== ĐỒ KHỞI ĐỘNG (vector dựng sẵn, chạy được ngay khi chưa có PNG) ====
  // Khi bạn đã có PNG do Gemini vẽ, chỉ cần xoá dòng svg đi là nó tự dùng PNG.
  const SKIN = { light: '#ffdbac', tan: '#e0ac69', deep: '#8d5524' };

  function bodySvg(skin) {
    const s = SKIN[skin], sh = shade(s, -14);
    return `
      <g>
        <rect x="206" y="392" width="42" height="72" rx="20" fill="${s}"/>
        <rect x="264" y="392" width="42" height="72" rx="20" fill="${s}"/>
        <ellipse cx="226" cy="470" rx="30" ry="15" fill="${sh}"/>
        <ellipse cx="286" cy="470" rx="30" ry="15" fill="${sh}"/>
        <rect x="236" y="252" width="40" height="46" rx="14" fill="${sh}"/>
        <rect x="191" y="280" width="130" height="122" rx="42" fill="${s}"/>
        <path d="M188 306 Q150 344 152 388" stroke="${s}" stroke-width="34" fill="none" stroke-linecap="round"/>
        <path d="M324 306 Q362 344 360 388" stroke="${s}" stroke-width="34" fill="none" stroke-linecap="round"/>
        <circle cx="152" cy="392" r="25" fill="${s}"/>
        <circle cx="360" cy="392" r="25" fill="${s}"/>
        <circle cx="146" cy="182" r="21" fill="${sh}"/>
        <circle cx="366" cy="182" r="21" fill="${sh}"/>
        <circle cx="256" cy="170" r="110" fill="${s}"/>
        <ellipse cx="215" cy="188" rx="15" ry="21" fill="#2b2338"/>
        <ellipse cx="297" cy="188" rx="15" ry="21" fill="#2b2338"/>
        <circle cx="220" cy="180" r="5.5" fill="#fff"/>
        <circle cx="302" cy="180" r="5.5" fill="#fff"/>
        <ellipse cx="188" cy="216" rx="19" ry="10" fill="#ff8fa3" opacity=".55"/>
        <ellipse cx="324" cy="216" rx="19" ry="10" fill="#ff8fa3" opacity=".55"/>
        <path d="M243 222 q13 14 26 0" stroke="#7a4a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>`;
  }

  function hairSvg(color, style) {
    const c = color, d = shade(color, -18);
    if (style === 'bob') return `<g>
        <path d="M152 258 q-14 -96 12 -132 q92 -46 184 0 q26 36 12 132 q-16 -70 -22 -86 a84 84 0 0 0 -164 0 q-6 16 -22 86z" fill="${c}"/>
        <path d="M150 96 q106 -74 212 0 q-58 -30 -106 -22 q-48 -8 -106 22z" fill="${d}"/>
      </g>`;
    if (style === 'spike') return `<g>
        <path d="M148 172 a108 108 0 0 1 216 0 z" fill="${c}"/>
        <path d="M150 172 l24 -60 l20 42 l26 -70 l24 56 l28 -74 l26 72 l24 -52 l22 46 l18 -36 l12 76z" fill="${c}"/>
        <path d="M186 108 q70 -42 140 -2 q-70 -22 -140 2z" fill="${d}" opacity=".7"/>
      </g>`;
    if (style === 'twin') return `<g>
        <path d="M148 172 a108 108 0 0 1 216 0 v22 h-216z" fill="${c}"/>
        <circle cx="128" cy="212" r="40" fill="${c}"/><circle cx="384" cy="212" r="40" fill="${c}"/>
        <circle cx="128" cy="212" r="40" fill="${d}" opacity=".35"/><circle cx="384" cy="212" r="40" fill="${d}" opacity=".35"/>
        <rect x="150" y="164" width="30" height="26" rx="12" fill="#ff5d8f"/>
        <rect x="332" y="164" width="30" height="26" rx="12" fill="#ff5d8f"/>
      </g>`;
    return `<g><path d="M148 178 a108 108 0 0 1 216 0 q-30 -34 -108 -30 q-78 -4 -108 30z" fill="${c}"/></g>`;
  }

  function shirtSvg(a, b) {
    return `<g>
      <rect x="183" y="272" width="146" height="126" rx="40" fill="${a}"/>
      <path d="M188 300 Q148 342 150 390" stroke="${a}" stroke-width="40" fill="none" stroke-linecap="round"/>
      <path d="M324 300 Q364 342 362 390" stroke="${a}" stroke-width="40" fill="none" stroke-linecap="round"/>
      <path d="M183 330 h146 v22 h-146z" fill="${b}"/>
      <path d="M228 272 q28 30 56 0 q-28 16 -56 0z" fill="${shade(a, -22)}"/>
    </g>`;
  }

  function pantsSvg(c) {
    const d = shade(c, -16);
    return `<g>
      <rect x="196" y="368" width="120" height="52" rx="20" fill="${c}"/>
      <rect x="202" y="392" width="46" height="70" rx="18" fill="${c}"/>
      <rect x="264" y="392" width="46" height="70" rx="18" fill="${c}"/>
      <rect x="196" y="368" width="120" height="14" rx="7" fill="${d}"/>
    </g>`;
  }

  const HAND = {
    sword: `<g><rect x="352" y="252" width="16" height="132" rx="6" fill="#dbe4f0"/>
      <path d="M360 240 l10 20 h-20z" fill="#f2f6fb"/>
      <rect x="336" y="378" width="48" height="14" rx="7" fill="#8b5a2b"/>
      <rect x="352" y="388" width="16" height="34" rx="7" fill="#5c3a1b"/></g>`,
    book: `<g><rect x="326" y="356" width="76" height="60" rx="8" fill="#c0392b"/>
      <rect x="334" y="364" width="60" height="44" rx="4" fill="#fdf3e3"/>
      <rect x="362" y="364" width="4" height="44" fill="#e3d5bb"/></g>`,
    lolly: `<g><rect x="356" y="330" width="10" height="70" rx="5" fill="#f8f4e8"/>
      <circle cx="361" cy="312" r="34" fill="#ff6fae"/>
      <path d="M361 312 m-34 0 a34 34 0 0 1 34 -34 a17 17 0 0 0 0 34z" fill="#fff" opacity=".7"/></g>`,
    staff: `<g><rect x="354" y="240" width="14" height="176" rx="7" fill="#7a4a2b"/>
      <circle cx="361" cy="232" r="30" fill="#5ee7ff" opacity=".9"/>
      <circle cx="361" cy="232" r="30" fill="none" stroke="#c9f7ff" stroke-width="5"/></g>`,
    balloon: `<g><path d="M361 320 q-4 30 0 62" stroke="#cbd5e1" stroke-width="4" fill="none"/>
      <ellipse cx="361" cy="284" rx="40" ry="48" fill="#ff8a5b"/>
      <ellipse cx="348" cy="266" rx="12" ry="16" fill="#fff" opacity=".55"/></g>`
  };

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const cl = (v) => Math.max(0, Math.min(255, v));
    const r = cl((n >> 16) + amt * 2.2), g = cl(((n >> 8) & 255) + amt * 2.2), b = cl((n & 255) + amt * 2.2);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  // ---- helper tạo item cho gọn ----
  function I(id, name, cat, rarity, opt) {
    const o = opt || {};
    return {
      id: id,
      name: name,
      cat: cat,
      rarity: rarity || 'common',
      src: o.src || ('avatars/' + cat + '/' + id + '.png'),
      back: o.back || null,
      hue: o.hue || 0,
      svg: o.svg || null,
      // BỘ (set): mỗi bộ do một người/một AI vẽ nên tỉ lệ đầu-thân khác nhau.
      // Đội tóc bộ này lên thân bộ kia là lệch ngay, nên thanh chọn của học
      // sinh chỉ hiện đồ CÙNG BỘ với tông da đang mặc.
      set: o.set || 'v1',
      // Chỗ đặt ảnh trên khung 512x512: [x, y, rộng, cao].
      // Bỏ trống = ảnh đã vẽ sẵn đúng chỗ, phủ kín cả khung.
      // Có giá trị = ảnh cắt sát viền, hệ thống tự đặt vào đúng vị trí này.
      // Lấy số bằng trang avatar_import.html, khỏi phải đo tay.
      place: o.place || null
    };
  }

  const ITEMS = [
    /* ---- TÔNG DA (bắt buộc chọn 1) ---- */
    I('body_light', 'Da sáng', 'body', 'common', { svg: bodySvg('light') }),
    I('body_tan', 'Da nâu', 'body', 'common', { svg: bodySvg('tan') }),
    I('body_deep', 'Da ngăm', 'body', 'common', { svg: bodySvg('deep') }),

    /* ---- TÓC ---- */
    I('hair_01', 'Tóc mái ngố', 'hair', 'common', { svg: hairSvg('#3b2f2f', 'bob') }),
    I('hair_02', 'Tóc dựng', 'hair', 'common', { svg: hairSvg('#2f3542', 'spike') }),
    I('hair_03', 'Tóc hai búi', 'hair', 'rare', { svg: hairSvg('#ff9ff3', 'twin') }),
    I('hair_04', 'Tóc bạch kim', 'hair', 'epic', { svg: hairSvg('#e8ecf1', 'spike') }),
    I('hair_05', 'Tóc lửa', 'hair', 'legend', { svg: hairSvg('#ff7f50', 'spike') }),

    /* ---- ÁO ---- */
    I('shirt_01', 'Áo đồng phục', 'shirt', 'common', { svg: shirtSvg('#ffffff', '#2f6fed') }),
    I('shirt_02', 'Áo thun xanh', 'shirt', 'common', { svg: shirtSvg('#3ec1a5', '#2a9c85') }),
    I('shirt_03', 'Áo khoác hồng', 'shirt', 'rare', { svg: shirtSvg('#ff7eb6', '#ffd6e7') }),
    I('shirt_04', 'Giáp tân binh', 'shirt', 'epic', { svg: shirtSvg('#8fa3bf', '#f0c419') }),
    I('shirt_05', 'Áo choàng rồng', 'shirt', 'legend', { svg: shirtSvg('#6c3fd1', '#ffd166') }),

    /* ---- QUẦN ---- */
    I('pants_01', 'Quần short xanh', 'pants', 'common', { svg: pantsSvg('#2f6fed') }),
    I('pants_02', 'Quần jean', 'pants', 'common', { svg: pantsSvg('#4a6fa5') }),
    I('pants_03', 'Váy hồng', 'pants', 'rare', { svg: pantsSvg('#ff7eb6') }),
    I('pants_04', 'Quần giáp', 'pants', 'epic', { svg: pantsSvg('#6b7a8f') }),

    /* =================================================================
     * BỘ ẢNH VẼ TAY (Gemini) — nhập bằng trang avatar_import.html
     * Ảnh đã bóc nền, cắt sát viền; số trong `place` là chỗ đặt trên
     * khung 512x512. Mấy món này khớp với thân `body_g1`.
     * ================================================================= */
    I('body_g1', 'Da nâu (vẽ tay)', 'body', 'rare', { set: 'g1', place: [128, 40, 257, 430] }),
    I('hair_g1', 'Tóc bạc gai', 'hair', 'epic', { set: 'g1', place: [134, 24, 244, 250] }),
    I('shirt_g1', 'Áo thuỷ thủ', 'shirt', 'rare', { set: 'g1', place: [141, 246, 230, 141] }),
    I('pants_g1', 'Quần jean lửng', 'pants', 'rare', { set: 'g1', place: [200, 370, 112, 98] }),
    I('hand_g1', 'Kiếm tập', 'hand', 'epic', { set: 'g1', place: [290, 210, 148, 170] }),

    /* ---- VẬT CẦM TAY ---- */
    I('hand_01', 'Kiếm gỗ', 'hand', 'common', { svg: HAND.sword }),
    I('hand_02', 'Sách phép', 'hand', 'common', { svg: HAND.book }),
    I('hand_03', 'Kẹo mút', 'hand', 'rare', { svg: HAND.lolly }),
    I('hand_04', 'Gậy pha lê', 'hand', 'epic', { svg: HAND.staff }),
    I('hand_05', 'Bóng bay', 'hand', 'rare', { svg: HAND.balloon })
  ];

  /* ------------------------------------------------------------------
   * 5. HÀM DÙNG CHUNG
   * ------------------------------------------------------------------ */
  const byId = {};
  ITEMS.forEach(function (it) { byId[it.id] = it; });

  function get(id) { return byId[id] || null; }

  /** Liệt kê đồ theo loại; truyền `set` để chỉ lấy đồ cùng bộ với thân đang mặc */
  function byCat(cat, set) {
    return ITEMS.filter(function (i) {
      return i.cat === cat && (!set || i.set === set);
    });
  }

  /** Bộ nào đang mặc, suy từ tông da */
  function setOf(outfit) {
    const b = get(outfit && typeof outfit === 'object' ? outfit.body : outfit);
    return b ? b.set : 'v1';
  }

  /** Tên dễ đọc của một bộ */
  function setName(set) { return SET_NAMES[set] || ('Bộ ' + set); }

  /** Thân người đầu tiên của một bộ — dùng khi đổi bộ giúp người chơi */
  function firstBodyOf(set) {
    const l = byCat('body', set);
    return l.length ? l[0].id : null;
  }

  /**
   * Đổi sang bộ khác nhưng CỐ GIỮ món vừa chọn.
   * Dùng khi học sinh bấm vào một món thuộc bộ khác: đổi thân người cho khớp,
   * bỏ các món cũ (vì chúng vẽ theo tỉ lệ thân cũ), giữ đúng món vừa bấm.
   */
  function switchSet(outfit, set, keepCat, keepId) {
    const o = { body: firstBodyOf(set) };
    CATEGORIES.forEach(function (c) { if (c.key !== 'body') o[c.key] = null; });
    if (keepCat === 'body') o.body = keepId; else if (keepCat) o[keepCat] = keepId;
    return o;
  }

  /** Danh sách các bộ đang có, kèm số món */
  function sets() {
    const m = {};
    ITEMS.forEach(function (i) { m[i.set] = (m[i.set] || 0) + 1; });
    return Object.keys(m).map(function (k) { return { set: k, count: m[k] }; });
  }

  /** Bỏ những món lạc bộ ra khỏi bộ đồ (vd đổi tông da sang bộ khác) */
  function fixSet(outfit) {
    const s = setOf(outfit);
    const o = { body: outfit.body };
    CATEGORIES.forEach(function (c) {
      if (c.key === 'body') return;
      const it = get(outfit[c.key]);
      o[c.key] = it && it.set === s ? it.id : null;
    });
    return o;
  }

  /** Bộ đồ mặc định khi mới vào */
  function defaultOutfit() {
    const b = byCat('body')[0];
    const s = b ? b.set : 'v1';
    const first = function (c) { const l = byCat(c, s); return l.length ? l[0].id : null; };
    return { body: b ? b.id : null, hair: first('hair'), shirt: first('shirt'), pants: first('pants'), hand: null };
  }

  /** Bộ đồ ngẫu nhiên (nút "Ngẫu nhiên") — luôn cùng một bộ cho khỏi lệch */
  function randomOutfit(set) {
    const bodies = byCat('body', set);
    const body = bodies[Math.floor(Math.random() * bodies.length)];
    const s = body ? body.set : 'v1';
    const pick = function (c) {
      const l = byCat(c, s);
      return l.length ? l[Math.floor(Math.random() * l.length)].id : null;
    };
    return { body: body ? body.id : null, hair: pick('hair'), shirt: pick('shirt'), pants: pick('pants'), hand: pick('hand') };
  }

  /** Gọn hoá bộ đồ thành chuỗi ngắn để gửi qua mạng: "body_light|hair_01|..." */
  function pack(outfit) {
    return CATEGORIES.map(function (c) { return outfit && outfit[c.key] ? outfit[c.key] : ''; }).join('|');
  }
  function unpack(str) {
    const p = String(str || '').split('|'), o = {};
    CATEGORIES.forEach(function (c, i) { o[c.key] = p[i] || null; });
    if (!o.body) o.body = 'body_light';
    return o;
  }

  /**
   * Dựng nhân vật thành một chuỗi SVG hoàn chỉnh.
   * Ảnh PNG (nếu có) được nhúng bằng <image>, đồ vector dùng thẳng.
   * @param {object} outfit  { body, hair, shirt, pants, hand }
   * @param {object} opt     { size, basePath }
   */
  function renderSVG(outfit, opt) {
    opt = opt || {};
    const size = opt.size || 180;
    const base = opt.basePath || '';
    const o = outfit || defaultOutfit();
    const parts = [];

    LAYERS.slice().sort(function (a, b) { return a.z - b.z; }).forEach(function (layer) {
      let item = null, useBack = false;
      if (layer.key === 'hairBack') { item = get(o.hair); useBack = true; }
      else { item = get(o[layer.key]); }
      if (!item) return;
      if (useBack && !item.back) return;

      const filter = item.hue ? ' style="filter:hue-rotate(' + item.hue + 'deg)"' : '';
      const p = item.place;
      const geo = p
        ? ' x="' + p[0] + '" y="' + p[1] + '" width="' + p[2] + '" height="' + p[3] + '" preserveAspectRatio="none"'
        : ' x="0" y="0" width="512" height="512"';
      if (useBack) {
        parts.push('<image href="' + base + item.back + '"' + geo + filter + '/>');
      } else if (item.svg) {
        parts.push(item.hue ? '<g style="filter:hue-rotate(' + item.hue + 'deg)">' + item.svg + '</g>' : item.svg);
      } else {
        parts.push('<image href="' + base + item.src + '"' + geo + filter + '/>');
      }
    });

    return '<svg class="chibi" viewBox="0 0 512 512" width="' + size + '" height="' + size +
      '" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">' + parts.join('') + '</svg>';
  }

  const API = {
    RIG: RIG, LAYERS: LAYERS, CATEGORIES: CATEGORIES, RARITY: RARITY, ITEMS: ITEMS,
    SET_NAMES: SET_NAMES,
    get: get, byCat: byCat, defaultOutfit: defaultOutfit, randomOutfit: randomOutfit,
    setOf: setOf, sets: sets, fixSet: fixSet, setName: setName,
    firstBodyOf: firstBodyOf, switchSet: switchSet,
    pack: pack, unpack: unpack, renderSVG: renderSVG
  };

  root.AVATAR_LIBRARY = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;

})(typeof window !== 'undefined' ? window : this);

</script>

 *

(function (root) {

  animation:lsPuff 5s ease-out forwards}

  100%{transform:scale(1.25);opacity:0}}
`;

  const FX_SHOW = 5200;   // hiệu ứng tương tác chạy bao lâu trên MỘT màn hình

  let cssDone = false;
  function injectCSS() {
    if (cssDone) return; cssDone = true;
    const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s);
  }

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) / 4294967295;
  }

  /**
   * Hàng 0 ở gần khán giả nhất (to nhất). Đầy hàng thì lùi ra hàng sau.
   * Số người mỗi hàng co theo bề ngang: màn chiếu xếp 6, điện thoại chỉ 3
   * — nếu không nhân vật trên điện thoại bé như con kiến.
   */
  function rowBase(W) { return Math.max(3, Math.min(8, Math.round(W / 180))); }
  function capacityOf(row, W) { return rowBase(W) + row * 2; }

  function slotOf(index, W) {
    let r = 0, k = index;
    while (k >= capacityOf(r, W)) { k -= capacityOf(r, W); r++; }
    return { row: r, col: k };
  }

  /**
   * Tính chỗ đứng theo PIXEL. Cỡ nhân vật bị chặn bởi cả bề ngang sân khấu
   * (chia đều cho số người mỗi hàng) lẫn chiều cao — thiếu vế nào cũng thành
   * chen chúc hoặc bé tí.
   */
  function layoutOf(index, total, W, H) {
    const s = slotOf(index, W), cap = capacityOf(s.row, W);
    let before = 0;
    for (let r = 0; r < s.row; r++) before += capacityOf(r, W);
    const inRow = Math.max(1, Math.min(cap, total - before));

    // Chặn dưới 48px: cửa sổ bị kéo thấp thì thà tràn còn hơn thu bé như hạt gạo
    const base = Math.max(48, Math.min(H * 0.40, (W * 0.94 / capacityOf(0, W))));
    const scale = Math.max(.46, 1 - s.row * 0.14);
    const size = base * scale;
    const gap = (W * 0.94 / cap);
    const left = W / 2 + (s.col - (inRow - 1) / 2) * Math.min(gap, size * 1.02);
    const bottom = H * 0.06 + s.row * (base * 0.75);

    return { left: left, bottom: bottom, size: size, z: 200 - s.row * 10 };
  }

  function mount(el, opt) {
    injectCSS();
    opt = opt || {};
    const L = root.AVATAR_LIBRARY;
    el.classList.add('ls-stage');
    el.innerHTML = '<div class="ls-floor"></div><div class="ls-glow"></div><div class="ls-beam"></div>' +
      '<div class="ls-empty">' + (opt.emptyText || 'Sân khấu đang trống — chờ người chơi vào…') + '</div>';
    const emptyEl = el.querySelector('.ls-empty');

    const nodes = new Map();   // id -> element
    const fxNodes = new Map(); // khoá cặp -> lớp icon trùm lên hai nhân vật
    const fxDone = new Map();  // khoá cặp -> lúc hiệu ứng hết hạn trên máy này
    const localIx = new Map(); // id người rủ -> màn tương tác do CHÍNH MÁY NÀY khơi ra
    let lastList = [], fxTimer = null;

    /**
     * Trộn màn tương tác "tự vẽ trước" của máy này vào danh sách nhận từ máy chủ.
     *
     * Bấm xong mà ngồi chờ Apps Script trả lời rồi mới vẽ thì mất khoảng 3 giây —
     * lâu tới mức em nào cũng tưởng bấm hụt và bấm lại. Nên máy tự vẽ ngay, còn
     * lượt gọi kia cứ đi đường của nó để các máy khác biết.
     *
     * Sau khi diễn xong, tin của MÁY CHỦ về đúng màn đó bị nuốt trong 25 giây
     * (`until`) — nếu không thì lát nữa nó vọng về và trái tim nở thêm lần nữa,
     * vì dấu thời gian của máy chủ khác dấu thời gian máy này nên bị coi là màn mới.
     */
    function withLocalIx(list) {
      const now = Date.now();
      localIx.forEach(function (v, k) { if (now > v.until) localIx.delete(k); });
      if (!localIx.size) return list;
      return list.map(function (p) {
        const v = localIx.get(p.id);
        if (!v) return p;
        const mine = now < v.t + FX_SHOW ? { w: v.w, k: v.k, t: v.t } : null;
        return Object.assign({}, p, { ix: mine });
      });
    }

    // Đổi cỡ cửa sổ / xoay ngang điện thoại -> xếp lại chỗ đứng
    let relayout = null;
    function onResize() {
      clearTimeout(relayout);
      relayout = setTimeout(function () { sync(lastList); }, 80);
    }
    if (root.ResizeObserver) new ResizeObserver(onResize).observe(el);
    else root.addEventListener('resize', onResize);

    function makeNode(p) {
      const d = document.createElement('div');
      d.className = 'ls-p ls-new' + (opt.meId && p.id === opt.meId ? ' ls-me' : '');
      d.innerHTML = '<div class="ls-dust"><i></i><i></i><i></i></div>' +
        '<div class="ls-tag"></div><div class="ls-body"></div>';
      d.querySelector('.ls-body').style.animationDelay = (-hash(p.id) * 2.6).toFixed(2) + 's';
      // Bấm vào nhân vật để rủ tương tác (chỉ trang học sinh truyền onPick vào)
      if (opt.onPick) {
        d.style.cursor = 'pointer';
        d.onclick = function () { if (d.__p) opt.onPick(d.__p); };
      }
      el.appendChild(d);
      setTimeout(function () { d.classList.remove('ls-new'); }, 1400);
      return d;
    }

    function paint(node, p) {
      node.__p = p;                 // luôn giữ bản mới nhất cho tay bấm ở trên
      const tag = node.querySelector('.ls-tag');
      if (tag.textContent !== p.name) tag.textContent = p.name;
      const key = L.pack(p.outfit && typeof p.outfit === 'object' ? p.outfit : L.unpack(p.outfit));
      if (node.dataset.outfit !== key) {
        node.dataset.outfit = key;
        node.querySelector('.ls-body').innerHTML =
          L.renderSVG(typeof p.outfit === 'string' ? L.unpack(p.outfit) : p.outfit, { size: 512 });
      }
      if (p.emote && node.dataset.emote !== String(p.emote.t)) {
        node.dataset.emote = String(p.emote.t);
        const e = document.createElement('div');
        e.className = 'ls-emote'; e.textContent = p.emote.e;
        node.appendChild(e);
        setTimeout(function () { e.remove(); }, 1900);
      }
    }

    /**
     * Ghép đôi những em đang tương tác. Máy chủ chỉ ghi ý định lên NGƯỜI RỦ
     * (`p.ix = {w: id bạn kia, k: 'love'|'fight', t}`), phía đây tự tìm bạn kia.
     * Mỗi em chỉ nằm trong MỘT cặp — hai em cùng rủ một người thì ai gửi trước
     * được ghép, người sau bị bỏ qua, chứ không thì một nhân vật bị kéo về hai
     * phía cùng lúc.
     */
    /**
     * Lọc ra những cặp CÒN ĐANG DIỄN trên đúng màn hình này.
     *
     * Máy chủ giữ tin tương tác tới 22 giây để máy nào hỏi thưa cũng nhận được,
     * nhưng hiệu ứng chỉ nên chạy 5 giây. Nên thời gian diễn do MÁY NÀY tự đếm
     * từ lúc nó nhìn thấy, chứ không lấy hiệu số với `ix.t`: `ix.t` là giờ của
     * máy chủ Google, còn đồng hồ điện thoại học sinh lệch cả phút là chuyện
     * thường — trừ nhau ra thì hiệu ứng khi thì không hiện, khi thì dính mãi.
     */
    function livePairs(list) {
      const now = Date.now();
      fxDone.forEach(function (end, k) { if (now - end > 120000) fxDone.delete(k); });
      return pairsOf(list).filter(function (pr) {
        const end = fxDone.get(pr.key);
        if (end === undefined) { fxDone.set(pr.key, now + FX_SHOW); return true; }
        return now < end;
      });
    }

    function pairsOf(list) {
      const byId = new Map(list.map(p => [p.id, p]));
      const used = new Set(), out = [];
      list.slice().sort((a, b) => (a.ix ? a.ix.t : 0) - (b.ix ? b.ix.t : 0)).forEach(function (p) {
        if (!p.ix || used.has(p.id)) return;
        const q = byId.get(p.ix.w);
        if (!q || q.id === p.id || used.has(q.id)) return;
        used.add(p.id); used.add(q.id);
        out.push({ a: p, b: q, kind: p.ix.k, t: p.ix.t, key: p.id + '|' + p.ix.t });
      });
      return out;
    }

    /** Xếp lại thứ tự để hai em trong cặp đứng liền nhau (thường là cùng hàng). */
    function orderFor(list, pairs) {
      if (!pairs.length) return list;
      const byId = new Map(list.map(p => [p.id, p]));
      const mate = new Map();
      pairs.forEach(pr => { mate.set(pr.a.id, pr.b.id); mate.set(pr.b.id, pr.a.id); });
      const done = new Set(), out = [];
      list.forEach(function (p) {
        if (done.has(p.id)) return;
        out.push(p); done.add(p.id);
        const m = mate.get(p.id);
        if (m && !done.has(m) && byId.has(m)) { out.push(byId.get(m)); done.add(m); }
      });
      return out;
    }

    function sync(raw) {
      lastList = raw || [];
      const list = withLocalIx(lastList);
      emptyEl.style.display = list.length ? 'none' : 'flex';

      const W = el.clientWidth || 800, H = el.clientHeight || 400;
      const pairs = livePairs(list);
      const order = orderFor(list, pairs);
      const busy = new Set();
      pairs.forEach(pr => { busy.add(pr.a.id); busy.add(pr.b.id); });

      // Tính chỗ đứng trước, dồn cặp lại sau, rồi mới vẽ — chứ vẽ ngay trong
      // vòng lặp thì lúc dồn cặp phải sờ lại DOM lần nữa.
      const geo = new Map();
      order.forEach(function (p, i) {
        const g = layoutOf(i, order.length, W, H);
        g.left += (hash(p.id + 'x') - .5) * g.size * 0.10;
        geo.set(p.id, g);
      });

      pairs.forEach(function (pr) {
        const ga = geo.get(pr.a.id), gb = geo.get(pr.b.id);
        if (!ga || !gb) return;
        // Kéo hai em xáp vào nhau quanh điểm giữa, hơi chồng lên nhau một chút
        const mid = (ga.left + gb.left) / 2, size = Math.max(ga.size, gb.size);
        const near = size * 0.32;
        const aFirst = ga.left <= gb.left;          // giữ nguyên ai đang đứng bên nào
        ga.left = mid + (aFirst ? -near : near);
        gb.left = mid + (aFirst ? near : -near);
        pr.mid = mid;
        pr.bottom = Math.min(ga.bottom, gb.bottom);
        pr.size = size;
        ga.z = gb.z = Math.max(ga.z, gb.z);
      });

      const seen = new Set();
      order.forEach(function (p) {
        seen.add(p.id);
        let node = nodes.get(p.id);
        if (!node) { node = makeNode(p); nodes.set(p.id, node); }
        paint(node, p);
        const g = geo.get(p.id);
        node.style.left = Math.round(g.left) + 'px';
        node.style.bottom = Math.round(g.bottom) + 'px';
        node.style.width = Math.round(g.size) + 'px';
        node.style.zIndex = g.z + (p.id === opt.meId ? 500 : 0);
        node.classList.toggle('ls-busy', busy.has(p.id));
        node.querySelector('.ls-tag').style.fontSize =
          Math.max(9, Math.min(17, g.size * 0.115)).toFixed(1) + 'px';
      });

      syncFx(pairs);

      // Sân khấu chỉ vẽ lại mỗi khi có tin mới từ máy chủ, mà điện thoại có
      // lúc 20 giây mới hỏi một lần. Không tự hẹn giờ thì hiệu ứng 5 giây sẽ
      // dính trên màn hình tới tận lượt hỏi sau — hẹn giờ ở đây là việc trong
      // máy, không tốn thêm lượt gọi nào.
      clearTimeout(fxTimer);
      if (pairs.length) {
        let soonest = Infinity;
        pairs.forEach(function (pr) { soonest = Math.min(soonest, fxDone.get(pr.key) - Date.now()); });
        fxTimer = setTimeout(function () { sync(lastList); }, Math.max(150, soonest + 60));
      }

      nodes.forEach(function (node, id) {
        if (seen.has(id)) return;
        node.classList.add('ls-out');
        nodes.delete(id);
        setTimeout(function () { node.remove(); }, 450);
      });
    }

    /** Trùm icon lên cặp đang tương tác, che kín cả hai nhân vật. */
    function syncFx(pairs) {
      const alive = new Set();
      pairs.forEach(function (pr) {
        alive.add(pr.key);
        let fx = fxNodes.get(pr.key);
        if (!fx) {
          fx = document.createElement('div');
          fx.className = 'ls-fx ' + (pr.kind === 'fight' ? 'fight' : 'love');
          fx.innerHTML = '<div class="ls-spark"></div><div class="ls-icon">' +
            (pr.kind === 'fight' ? '💥' : '💖') + '</div>';
          el.appendChild(fx);
          fxNodes.set(pr.key, fx);
          if (opt.onInteract) opt.onInteract(pr);
        }
        // Hai em đã xáp lại còn cách nhau ~0,64 lần cỡ nhân vật, nên bề ngang
        // cặp cỡ 1,6 lần. Icon lấy hơn thế một chút để trùm kín cả hai.
        fx.style.left = Math.round(pr.mid) + 'px';
        fx.style.bottom = Math.round(pr.bottom + pr.size * 0.06) + 'px';
        fx.style.width = Math.round(pr.size * 1.9) + 'px';
        fx.style.height = Math.round(pr.size * 1.05) + 'px';
        fx.style.fontSize = Math.round(pr.size * 1.05) + 'px';
        fx.style.zIndex = 900;
      });
      fxNodes.forEach(function (fx, key) {
        if (alive.has(key)) return;
        fxNodes.delete(key);
        fx.remove();
      });
    }

    return {
      el: el,
      sync: sync,
      count: function () { return lastList.length; },
      setMe: function (id) { opt.meId = id; sync(lastList); },

      /** Vẽ ngay màn tương tác vừa bấm, không chờ máy chủ trả lời. */
      playLocal: function (fromId, toId, kind) {
        const t = Date.now();
        localIx.set(fromId, { w: toId, k: kind, t: t, until: t + 25000 });
        sync(lastList);
      },
      /** Máy chủ từ chối thì rút lại màn vừa vẽ. */
      cancelLocal: function (fromId) {
        if (!localIx.delete(fromId)) return;
        sync(lastList);
      }
    };
  }

  root.LiveStage = { mount: mount, layoutOf: layoutOf };

})(typeof window !== 'undefined' ? window : this);

</script>

/* === live_net.js === */
/* =====================================================================
 *  LIVE NET — lớp kết nối phòng chơi trực tiếp
 *  ---------------------------------------------------------------
 *  Cùng một bộ hàm chạy được ở 2 nơi:
 *    · Chạy thử ở máy:  POST tới  http://localhost:3000/live   (server.js)
 *    · Bản thật:        POST tới  Google Apps Script /exec     (template.js)
 *
 *  Trang nào muốn dùng bản thật thì đặt trước khi nạp file này:
 *      <script>window.LIVE_ENDPOINT = 'https://script.google.com/.../exec';<\/script>
 * ===================================================================== */

(function (root) {
  'use strict';

  // Thứ tự ưu tiên: biến gắn sẵn trong trang > tham số ?api=... trên URL > máy này
  let ep = root.LIVE_ENDPOINT;
  if (!ep && typeof location !== 'undefined') {
    try { ep = new URLSearchParams(location.search).get('api') || ''; } catch (e) { }
  }
  let ENDPOINT = ep || '/live';
  let IS_GAS = /script\.google\.com/.test(ENDPOINT);

  function call(action, payload) {
    const body = JSON.stringify(Object.assign({ action: action }, payload || {}));
    return fetch(ENDPOINT, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      // text/plain để không sinh preflight OPTIONS — Apps Script không trả lời OPTIONS
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body
    }).then(function (r) {
      if (!r.ok) throw new Error('Lỗi mạng ' + r.status);
      return r.json();
    }).then(function (d) {
      if (d && d.error) throw new Error(d.error);
      return d;
    });
  }

  /** Vòng lặp hỏi trạng thái phòng. Tự giãn nhịp khi tab bị ẩn hoặc mạng lỗi. */
  function Poller(pin, onState, opt) {
    opt = opt || {};
    // Apps Script tính hạn mức theo TỔNG THỜI GIAN CHẠY (tài khoản Gmail thường
    // chỉ 90 phút/ngày), chứ không theo số lượt gọi. Nên:
    //   · phòng đang có người vào ra  -> hỏi dày, cho kịp không khí
    //   · phòng đứng yên              -> giãn dần ra tới `slow`, đỡ tốn quota
    // Đo thật: bỏ phần giãn nhịp này thì một buổi 40 em ăn gần 20 phút quota.
    const fast = opt.interval || (IS_GAS ? 3000 : 800);
    const slow = opt.maxInterval || (IS_GAS ? fast * 4 : fast * 3);
    let rev = -1, timer = null, stopped = false, fails = 0, idle = 0;

    function tick() {
      if (stopped) return;
      call('liveState', { pin: pin, rev: rev, playerId: opt.playerId || '' })
        .then(function (d) {
          fails = 0;
          if (d && d.changed === false) {
            idle++;                       // không có gì mới -> thở chậm lại
          } else if (d) {
            idle = 0; rev = d.rev; onState(d);
          }
          const wait = Math.min(slow, Math.round(fast * (1 + idle * 0.6)));
          schedule(document.hidden ? wait * 3 : wait);
        })
        .catch(function (e) {
          fails++;
          if (opt.onError) opt.onError(e, fails);
          schedule(Math.min(fast * Math.pow(1.8, fails), 15000));
        });
    }
    function schedule(ms) { clearTimeout(timer); timer = setTimeout(tick, ms); }

    return {
      start: function () { stopped = false; tick(); return this; },
      stop: function () { stopped = true; clearTimeout(timer); },
      refreshNow: function () { rev = -1; idle = 0; schedule(0); }
    };
  }

  root.LiveNet = {
    endpoint: ENDPOINT,
    isGAS: IS_GAS,
    call: call,
    Poller: Poller,

    /**
     * Đổi chỗ chạy phòng ngay giữa chừng (màn hình lớp gọi khi bật đường hầm).
     * Nhớ tạo lại Poller sau khi gọi: nhịp hỏi được chốt lúc tạo, mà chạy tại
     * máy thì hỏi dày gấp năm lần chạy trên Google.
     */
    use: function (endpoint) {
      ENDPOINT = endpoint || '/live';
      IS_GAS = /script\.google\.com/.test(ENDPOINT);
      root.LiveNet.endpoint = ENDPOINT;
      root.LiveNet.isGAS = IS_GAS;
      return ENDPOINT;
    },

    createRoom: function (title, quizId) { return call('liveCreate', { title: title, quizId: quizId || '' }); },
    join: function (pin, name, outfit) { return call('liveJoin', { pin: pin, name: name, outfit: outfit }); },
    update: function (pin, playerId, outfit, name) { return call('liveUpdate', { pin: pin, playerId: playerId, outfit: outfit, name: name }); },
    leave: function (pin, playerId) { return call('liveLeave', { pin: pin, playerId: playerId }); },
    hostCmd: function (pin, token, cmd, arg) { return call('liveHost', { pin: pin, hostToken: token, cmd: cmd, arg: arg || '' }); },
    emote: function (pin, playerId, emote) { return call('liveEmote', { pin: pin, playerId: playerId, emote: emote }); },
    /** kind: 'love' (ôm hôn) hoặc 'fight' (tỉ thí) */
    interact: function (pin, playerId, target, kind) {
      return call('liveInteract', { pin: pin, playerId: playerId, target: target, kind: kind });
    },

    /* ---- giai đoạn làm bài ---- */
    setQuiz: function (pin, token, quiz) { return call('liveSetQuiz', { pin: pin, hostToken: token, quiz: quiz }); },
    getQuiz: function (pin) { return call('liveQuiz', { pin: pin }); },
    results: function (pin, token) { return call('liveResults', { pin: pin, hostToken: token }); },

    /** p = { sc, an, ok, ms, done, det } — xem Progress bên dưới, đừng gọi tay. */
    progress: function (pin, playerId, p) {
      return call('liveProgress', Object.assign({ pin: pin, playerId: playerId }, p || {}));
    }
  };

  /**
   * Nhịp báo điểm của học sinh.
   *
   * Trong lúc làm bài, trang học sinh KHÔNG hỏi trạng thái phòng nữa — nó chỉ
   * báo điểm về, và chính câu trả lời của lượt báo đó mang sẵn thứ hạng.
   * Mỗi em một lượt gọi mỗi `every` giây, chứ báo sau từng câu thì 35 em × 20
   * câu = 700 lượt, ăn đứt hạn mức 90 phút/ngày chỉ trong một buổi.
   *
   *   const rep = LiveNet.Reporter(pin, id, onRank);
   *   rep.push({sc, an, ok, ms});   // gọi thoải mái sau mỗi câu, tự dồn lại
   *   rep.finish({...});            // nộp bài -> gửi ngay, không chờ
   */
  function Reporter(pin, playerId, onRank, opt) {
    opt = opt || {};
    const every = (opt.every || (IS_GAS ? 25 : 4)) * 1000;
    let last = 0, pending = null, timer = null, sending = false, stopped = false;

    function send(now) {
      if (stopped || sending || !pending) return;
      if (!now && Date.now() - last < every) return schedule();
      const body = pending; pending = null; sending = true; last = Date.now();
      root.LiveNet.progress(pin, playerId, body)
        .then(function (d) { if (onRank) onRank(d); })
        .catch(function () { if (!pending) pending = body; })   // hụt thì để lượt sau gửi lại
        .then(function () { sending = false; schedule(); });
    }
    function schedule() {
      clearTimeout(timer);
      if (stopped || !pending) return;
      // Bài đã nộp thì gửi ngay: cả lớp đang nhìn bảng xếp hạng trên máy chiếu
      const wait = pending.done ? 300 : Math.max(300, every - (Date.now() - last));
      timer = setTimeout(function () { send(true); }, wait);
    }

    return {
      push: function (body) { pending = body; send(false); },
      finish: function (body) { pending = Object.assign({}, body, { done: true }); send(true); },
      stop: function () { stopped = true; clearTimeout(timer); }
    };
  }
  root.LiveNet.Reporter = Reporter;

})(typeof window !== 'undefined' ? window : this);

    <script>
/* === live_quiz.js === */
/* =====================================================================
 *  LIVE QUIZ — bộ đề cho phòng chơi trực tiếp
 *  ---------------------------------------------------------------
 *  Dùng chung cho HAI trang:
 *    · live_host.html   — lọc câu từ ngân hàng rồi đóng gói bộ đề
 *    · live_player.html — chấm bài và tính điểm ngay trên máy học sinh
 *
 *  Ngân hàng câu hỏi GIỮ NGUYÊN: vẫn là sheet `questionbank` của trang
 *  Quản lý câu hỏi, đọc qua đúng action `get_sheet_data` cũ. Ở đây chỉ
 *  DỊCH các dòng đó sang một dạng gọn hơn để nhét vừa bộ nhớ đệm.
 *
 *  Vì sao khoá lại viết tắt (q, o, a, x…): cả bộ đề phải nằm lọt trong
 *  một ô CacheService của Apps Script (100KB/ô). Đặt tên dài kiểu
 *  "question"/"options" thì riêng tên khoá đã ngốn vài KB cho 25 câu.
 *
 *  CHẤM BÀI CHẠY Ở MÁY HỌC SINH — nghĩa là đáp án có nằm trong máy các em.
 *  Đây là đánh đổi có chủ ý: chấm ở máy chủ thì mỗi câu của mỗi em là một
 *  lượt gọi Apps Script (35 em × 20 câu = 700 lượt ≈ 15 phút hạn mức cho
 *  MỘT buổi), trong khi hạn mức cả ngày chỉ có 90 phút. Kahoot/Quizizz
 *  cũng gửi đáp án xuống máy chơi. Em nào mở được công cụ nhà phát triển
 *  thì xem trộm được — chơi vui trên lớp thì chấp nhận, còn kiểm tra lấy
 *  điểm thật thì vẫn dùng đường phát đề như cũ.
 * ===================================================================== */

(function (root) {
    'use strict';

    // Ảnh trong ngân hàng nằm ở sheet riêng dưới dạng base64 (xem `uploadImage`
    // trong script quản lý). Kéo về rồi nhét vào bộ đề thì vỡ ngay giới hạn
    // 100KB, nên câu có ảnh bị bỏ qua — và báo rõ số lượng cho giáo viên.
    var IMG_REF = /img:[a-z0-9]+/i;

    var DEFAULT_LIMIT = 30;      // giây cho mỗi câu
    var BASE_POINT = 100;      // trả lời đúng
    var SPEED_POINT = 100;      // thưởng thêm tối đa cho tốc độ
    var STREAK_POINT = 10;       // mỗi câu đúng liên tiếp
    var STREAK_MAX = 50;

    function txt(v) { return v === null || v === undefined ? '' : String(v); }
    function clean(v) { return txt(v).trim(); }

    function hasImage(q) {
        if (q.imageUrl && !/^https?:/i.test(txt(q.imageUrl))) return true;
        var parts = [q.question, q.groupPrompt, q.explanation];
        if (Array.isArray(q.options)) parts = parts.concat(q.options);
        if (Array.isArray(q.subQuestions)) {
            q.subQuestions.forEach(function (s) {
                if (s.imageUrl && !/^https?:/i.test(txt(s.imageUrl))) parts.push('img:x');
                parts.push(s.question, s.explanation);
            });
        }
        for (var i = 0; i < parts.length; i++) if (IMG_REF.test(txt(parts[i]))) return true;
        return false;
    }

    /** Đáp án câu nhiều lựa chọn có thể là số 0-3, chuỗi "2", hoặc chữ "B". */
    function mcIndex(raw, options) {
        var s = clean(raw);
        if (s === '') return -1;
        if (/^[0-9]+$/.test(s)) return Number(s);
        if (/^[A-Ha-h]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
        // Có ngân hàng ghi thẳng nội dung đáp án đúng
        for (var i = 0; i < options.length; i++) if (clean(options[i]) === s) return i;
        return -1;
    }

    function toBool(raw) {
        if (typeof raw === 'boolean') return raw;
        var s = clean(raw).toUpperCase();
        if (s === 'TRUE' || s === 'ĐÚNG' || s === 'DUNG' || s === '1') return true;
        if (s === 'FALSE' || s === 'SAI' || s === '0') return false;
        return null;
    }

    /**
     * Một dòng ngân hàng -> 0..n câu trong phòng chơi.
     * Câu chùm (`group`) được TRẢI RA thành từng ý Đúng/Sai riêng, mỗi ý mang
     * theo đoạn dẫn chung — chứ bắt học sinh trả lời 4 ý trên một màn hình
     * điện thoại rồi mới tính điểm thì mất hẳn nhịp game.
     */
    function normalize(q) {
        var out = [];
        var type = clean(q.type).toLowerCase();
        var subject = clean(q.subject);
        var img = /^https?:/i.test(txt(q.imageUrl)) ? clean(q.imageUrl) : '';

        if (type === 'group') {
            var prompt = clean(q.groupPrompt) || clean(q.question);
            (q.subQuestions || []).forEach(function (s, i) {
                var a = toBool(s.answer);
                if (a === null || !clean(s.question)) return;
                out.push({
                    i: clean(s.id) || (clean(q.id) + '_' + i), t: 'tf',
                    q: clean(s.question), a: a, s: subject,
                    c: prompt, m: img,
                    x: clean(s.explanation) || clean(q.explanation)
                });
            });
            return out;
        }

        if (!clean(q.question)) return out;

        if (type === 'mc') {
            var opts = Array.isArray(q.options) ? q.options.map(clean).filter(function (o) { return o !== ''; }) : [];
            if (opts.length < 2) return out;
            var idx = mcIndex(q.answer, opts);
            if (idx < 0 || idx >= opts.length) return out;
            out.push({ i: clean(q.id), t: 'mc', q: clean(q.question), o: opts, a: idx, s: subject, m: img, x: clean(q.explanation) });
        } else if (type === 'tf') {
            var b = toBool(q.answer);
            if (b === null) return out;
            out.push({ i: clean(q.id), t: 'tf', q: clean(q.question), a: b, s: subject, m: img, x: clean(q.explanation) });
        } else if (type === 'fib' || type === 'fill' || type === 'short') {
            var a2 = clean(q.answer);
            if (a2 === '') return out;
            out.push({ i: clean(q.id), t: 'fib', q: clean(q.question), a: a2, s: subject, m: img, x: clean(q.explanation) });
        }
        return out;
    }

    /** Xáo trộn tại chỗ (Fisher–Yates). */
    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }

    /** Xáo đáp án A/B/C/D nhưng vẫn giữ đúng vị trí đáp án đúng. */
    function shuffleOptions(item) {
        if (item.t !== 'mc') return item;
        var pairs = item.o.map(function (o, i) { return { o: o, right: i === item.a }; });
        shuffle(pairs);
        item.o = pairs.map(function (p) { return p.o; });
        item.a = pairs.findIndex(function (p) { return p.right; });
        return item;
    }

    /**
     * Gom bộ đề từ dữ liệu thô của `get_sheet_data`.
     * @param {Array} rows  danh sách câu hỏi trả về từ script quản lý
     * @param {object} opt  { count, subjects, shuffle, shuffleOptions, limit, title }
     * @returns {{quiz:object, stats:object}}
     */
    function build(rows, opt) {
        opt = opt || {};
        var stats = { total: 0, image: 0, unusable: 0, taken: 0 };
        var pool = [];

        (rows || []).forEach(function (q) {
            if (!q || !clean(q.type)) return;
            if (clean(q.type).toLowerCase() === 'sub') return;   // đã gộp vào câu chùm
            stats.total++;
            if (hasImage(q)) { stats.image++; return; }
            var items = normalize(q);
            if (!items.length) { stats.unusable++; return; }
            pool = pool.concat(items);
        });

        if (opt.subjects && opt.subjects.length) {
            pool = pool.filter(function (it) { return opt.subjects.indexOf(it.s) >= 0; });
        }

        if (opt.shuffle !== false) shuffle(pool);
        var count = Number(opt.count) || 0;
        if (count > 0 && pool.length > count) pool = pool.slice(0, count);
        if (opt.shuffleOptions !== false) pool.forEach(shuffleOptions);

        // Câu không có hướng dẫn giải thì bỏ hẳn khoá `x` cho nhẹ
        pool.forEach(function (it) {
            if (!it.x) delete it.x;
            if (!it.m) delete it.m;
            if (!it.c) delete it.c;
        });

        stats.taken = pool.length;
        return {
            quiz: {
                t: clean(opt.title) || 'Phòng ôn tập',
                lim: Number(opt.limit) > 0 ? Number(opt.limit) : DEFAULT_LIMIT,
                db: clean(opt.dbId),
                dbn: clean(opt.dbName),
                qs: pool
            },
            stats: stats
        };
    }

    /** Danh sách môn có trong ngân hàng, kèm số câu dùng được. */
    function subjectsOf(rows) {
        var map = {};
        (rows || []).forEach(function (q) {
            if (!q || !clean(q.type) || clean(q.type).toLowerCase() === 'sub') return;
            if (hasImage(q)) return;
            var items = normalize(q);
            if (!items.length) return;
            var s = clean(q.subject) || '(không ghi môn)';
            map[s] = (map[s] || 0) + items.length;
        });
        return Object.keys(map).sort().map(function (k) { return { name: k, count: map[k] }; });
    }

    /** So sánh câu điền khuyết: bỏ qua hoa thường, dấu cách, và 1,5 = 1.5 */
    function sameText(a, b) {
        var x = clean(a).toLowerCase().replace(/\s+/g, ' ');
        var y = clean(b).toLowerCase().replace(/\s+/g, ' ');
        if (x === y) return true;
        var nx = Number(x.replace(',', '.')), ny = Number(y.replace(',', '.'));
        if (!isNaN(nx) && !isNaN(ny) && x !== '' && y !== '') return Math.abs(nx - ny) < 0.01;
        return false;
    }

    function isCorrect(item, ans) {
        if (ans === null || ans === undefined || ans === '') return false;
        if (item.t === 'mc') return Number(ans) === Number(item.a);
        if (item.t === 'tf') return (ans === true || ans === 'true') === (item.a === true);
        return sameText(ans, item.a);
    }

    /**
     * Điểm một câu. Trả lời càng nhanh càng nhiều điểm, đúng liên tiếp có
     * thưởng thêm — đây là chỗ tạo ra không khí đua trên bảng xếp hạng.
     */
    function points(correct, ms, limitSec, streak) {
        if (!correct) return 0;
        var lim = (Number(limitSec) || DEFAULT_LIMIT) * 1000;
        var left = Math.max(0, 1 - (Number(ms) || 0) / lim);
        var bonus = Math.round(SPEED_POINT * left);
        var st = Math.min(STREAK_MAX, Math.max(0, (Number(streak) || 0) - 1) * STREAK_POINT);
        return BASE_POINT + bonus + st;
    }

    root.LiveQuiz = {
        DEFAULT_LIMIT: DEFAULT_LIMIT,
        build: build,
        subjectsOf: subjectsOf,
        normalize: normalize,
        isCorrect: isCorrect,
        points: points,
        shuffle: shuffle
    };

})(typeof window !== 'undefined' ? window : this);
